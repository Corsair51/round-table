name: Round Table Build and Test

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RoundTable.slnx

      - name: Build solution
        run: dotnet build RoundTable.slnx --configuration Release --no-restore

      - name: Run unit tests with coverage and TRX reporting
        run: >
          dotnet test RoundTable.slnx
          --configuration Release
          --no-build
          -- --coverage --coverage-output-format cobertura --report-trx -results-directory ./TestResults

      - name: Publicsh Test Results (Azure DevOps-style UI)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Tests Results
          path: './TestResults/**/*.trx'
          reporter: dotnet-trx

      - name: Generate HTML Code Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        if: always()
        with:
          reports: './TestResults/**/coverage.cobertura.xml'
          targetdir: './CoverageReport'
          reporttypes: 'HtmlInline_AzurePipelines;MarkdownSummaryGithub'

      - name: Append Coverage Summary to GitHub Job Summary
        if: always()
        run: cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: coverlet-coverage-report
          path: ./TestResults/**/coverage.cobertura.xml